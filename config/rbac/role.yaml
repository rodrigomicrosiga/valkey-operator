---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - ""
  resources:
  - persistentvolumeclaims
  - services
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - apps
  resources:
  - statefulsets
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - valkey.cloud104.io
  resources:
  - valkeyinstances
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - valkey.cloud104.io
  resources:
  - valkeyinstances/finalizers
  verbs:
  - update
- apiGroups:
  - valkey.cloud104.io
  resources:
  - valkeyinstances/status
  verbs:
  - get
  - patch
  - update
